# Builds VirtuAI IDE (Electrobun) for macOS arm64, Linux x64, and Windows x64,
# then publishes one GitHub Release plus the Electrobun updater feed.
# Trigger (same shape as virtuaiDesktop):
#
#   git tag v0.1.6 && git push virtuai-ide v0.1.6
#   Actions → Release desktop → Run workflow (version 0.1.6)
#
# Signing / notarization is optional for dogfood: Gatekeeper will warn on
# first open until Apple secrets are copied from VirtuAiRepo/virtuaiDesktop
# (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_API_KEY_P8,
# APPLE_API_KEY, APPLE_API_ISSUER). APPLE_CERTIFICATE is the Developer ID
# Application .p12 (public cert + private key). Notarization is not the Mac
# App Store — it is Developer ID distribution so macOS trusts a direct DMG.
name: Release desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.2 (tags this commit as v0.1.2)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

concurrency:
  group: release-desktop-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Stamp version and channel
        run: |
          version="${TAG#v}"
          cat > packages/shared/src/version.ts <<EOF
          export const version = "${version}";
          export const channel = "stable";
          export const commit = "${{ github.sha }}";
          export const posthogProjectKey = "";
          EOF

      - name: Tag on workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"

      - name: Signing identity (optional)
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE unset — shipping unsigned dogfood DMG."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$identity" ]; then
            echo "No Developer ID Application identity in APPLE_CERTIFICATE" >&2
            security find-identity -v "$keychain" >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Notarization key (optional)
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "APPLE_API_KEY_P8 unset — will sign without notarize." >&2
            echo "notarize=false" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "notarize=true" >> "$GITHUB_ENV"

      - name: Install and package stable
        run: |
          bun install --frozen-lockfile
          bun run desktop:package:stable

      - name: Build DMG (sign/notarize when secrets present)
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          app="apps/desktop/build/stable-macos-arm64/VirtuAI.app"
          if [ ! -d "$app" ]; then
            app="$(find apps/desktop/build -path '*stable*' -name 'VirtuAI.app' -type d | head -1)"
          fi
          if [ -z "${app:-}" ] || [ ! -d "$app" ]; then
            echo "VirtuAI.app not found under apps/desktop/build" >&2
            find apps/desktop/build -maxdepth 3 -type d -print >&2
            exit 1
          fi
          if [ "$SIGNED" = "true" ]; then
            codesign --force --deep --options runtime \
              --sign "$APPLE_SIGNING_IDENTITY" "$app"
            codesign --verify --deep --strict "$app"
          fi
          dmg="$RUNNER_TEMP/VirtuAI-${version}-macos-arm64.dmg"
          chmod +x scripts/make-macos-installer-dmg.sh
          scripts/make-macos-installer-dmg.sh "$app" "$dmg" "VirtuAI"
          if [ "$SIGNED" = "true" ]; then
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
            if [ "${notarize:-false}" = "true" ]; then
              xcrun notarytool submit "$dmg" \
                --key "$APPLE_API_KEY_PATH" \
                --key-id "$APPLE_API_KEY" \
                --issuer "$APPLE_API_ISSUER" \
                --wait
              xcrun stapler staple "$dmg"
            fi
          fi
          cp "$dmg" "VirtuAI-${version}-macos-arm64.dmg"
          echo "DMG=VirtuAI-${version}-macos-arm64.dmg" >> "$GITHUB_ENV"

      - name: Collect macOS release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          manifest="$(find apps/desktop/artifacts -name 'stable-macos-arm64-update.json' | head -1)"
          archive="$(find apps/desktop/artifacts -name 'stable-macos-arm64-VirtuAI.app.tar.zst' | head -1)"
          if [ -z "$manifest" ] || [ -z "$archive" ] || [ ! -f "$DMG" ]; then
            echo "stable macOS artifacts missing" >&2
            find apps/desktop/artifacts -maxdepth 2 -type f -print >&2 || true
            exit 1
          fi
          cp "$DMG" "release-assets/$(basename "$DMG")"
          cp "$manifest" "release-assets/$(basename "$manifest")"
          cp "$archive" "release-assets/$(basename "$archive")"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: release-assets/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Stamp version and channel
        run: |
          version="${TAG#v}"
          cat > packages/shared/src/version.ts <<EOF
          export const version = "${version}";
          export const channel = "stable";
          export const commit = "${{ github.sha }}";
          export const posthogProjectKey = "";
          EOF

      - name: Install desktop runtime packages
        uses: ./.github/actions/desktop-apt

      - name: Install and package stable
        run: |
          bun install --frozen-lockfile
          bun run desktop:package:stable

      - name: Collect Linux release assets
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p release-assets
          installer="apps/desktop/artifacts/linux-x64-VirtuAI-Setup.tar.gz"
          manifest="apps/desktop/artifacts/stable-linux-x64-update.json"
          archive="$(find apps/desktop/artifacts -maxdepth 1 -type f -name 'stable-linux-x64-*.tar.zst' | head -1)"
          if [ ! -f "$installer" ] || [ ! -f "$manifest" ] || [ -z "$archive" ]; then
            echo "stable Linux artifacts missing" >&2
            find apps/desktop/artifacts -maxdepth 2 -type f -print >&2 || true
            exit 1
          fi
          cp "$installer" "release-assets/VirtuAI-${version}-linux-x64.tar.gz"
          cp "$manifest" "release-assets/$(basename "$manifest")"
          cp "$archive" "release-assets/$(basename "$archive")"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: release-assets/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Stamp version and channel
        shell: bash
        run: |
          version="${TAG#v}"
          cat > packages/shared/src/version.ts <<EOF
          export const version = "${version}";
          export const channel = "stable";
          export const commit = "${{ github.sha }}";
          export const posthogProjectKey = "";
          EOF

      - name: Install and package stable
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          # Git's tar precedes Windows tar and breaks Electrobun's zstd archives.
          system32="$(cygpath -u "$SYSTEMROOT")/System32"
          export PATH="$system32:$PATH"
          bun run desktop:package:stable

      - name: Collect Windows release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p release-assets
          installer="apps/desktop/artifacts/win-x64-VirtuAI-Setup.zip"
          manifest="apps/desktop/artifacts/stable-win-x64-update.json"
          archive="$(find apps/desktop/artifacts -maxdepth 1 -type f -name 'stable-win-x64-*.tar.zst' | head -1)"
          if [ ! -f "$installer" ] || [ ! -f "$manifest" ] || [ -z "$archive" ]; then
            echo "stable Windows artifacts missing" >&2
            find apps/desktop/artifacts -maxdepth 2 -type f -print >&2 || true
            exit 1
          fi
          cp "$installer" "release-assets/VirtuAI-${version}-windows-x64.zip"
          cp "$manifest" "release-assets/$(basename "$manifest")"
          cp "$archive" "release-assets/$(basename "$archive")"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # gh release create --generate-notes runs git; a bare runner is not a repo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub Release and updater feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          echo "release assets:"
          ls -la release-assets
          installers=(release-assets/VirtuAI-*)
          updates=(release-assets/stable-*)
          if [ "${#installers[@]}" -ne 3 ] || [ "${#updates[@]}" -lt 6 ]; then
            echo "expected 3 installers and 6 updater files" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${installers[@]}" --clobber
          else
            gh release create "$TAG" "${installers[@]}" \
              --title "VirtuAI IDE ${TAG}" \
              --generate-notes \
              --prerelease
          fi
          # Electrobun Updater reads {baseUrl}/{channel}-{os}-{arch}-update.json
          # (release.baseUrl → …/releases/download/desktop-updates).
          if gh release view desktop-updates >/dev/null 2>&1; then
            gh release upload desktop-updates "${updates[@]}" --clobber
          else
            gh release create desktop-updates "${updates[@]}" \
              --title "Electrobun update feed" \
              --notes "Stable updater manifests and archives for VirtuAI IDE. Not a user-facing installer — use the v* release assets."
          fi
